name: CI Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: bb test-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure tooling
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-cljdeps-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-cljdeps-

      - name: Run all tests
        run: bb test-all
